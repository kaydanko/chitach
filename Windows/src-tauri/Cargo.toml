[package]
name = "chytach"
version = "0.3.0"
description = "Читалка електронних книг"
authors = ["Chytach"]
license = "MIT"
repository = "https://github.com/kaydanko/chitach"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chytach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.4"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

# Лише для систем, де подвійне клацання на файлі запускає новий процес.
# На macOS цим опікується сама система.
[target."cfg(any(target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = "2.3.6"

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chytach</title>
    <style>
      /* Тло, яке видно до першого кадру й у щілинах. Чорне навмисно: у
         темряві спалах білого на запуску різкий для очей. */
      :root { --void: #0A0A0A; --paper: #CDC28B; --on-void: #E4DFD0; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--void);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      /* Підкладка з зерном лежить під областю читання: бічні поля на
         розвороті робляться звуженням цієї області, і в смузі з краю видно
         саме її. */
      #backdrop {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image: url(./grain.png);
        background-repeat: repeat;
        background-size: 128px 128px;
      }

      #reader {
        position: absolute;
        inset: 0;
      }

      /* Розміри кадрів задає застосунок: тулкіт лише вішає на них клас і
         ставить `position: absolute`, власного CSS не возить. Без цього
         правила браузер малює iframe типовими 300×150. */
      #reader iframe.readium-navigator-iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Початковий екран: видно, доки не відкрито жодної книги. */
      #start {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: var(--void);
        color: var(--on-void);
      }

      #start h1 {
        margin: 0;
        font-size: 44px;
        font-weight: 400;
      }

      #start p {
        margin: 0 0 32px;
        opacity: 0.6;
      }

      #open-book {
        min-width: 240px;
        padding: 14px 24px;
        border: 0;
        border-radius: 999px;
        background: var(--paper);
        color: #38331C;
        font-size: 16px;
        cursor: pointer;
      }

      #open-sample {
        margin-top: 6px;
        padding: 10px;
        border: 0;
        background: none;
        color: var(--on-void);
        opacity: 0.7;
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      #error {
        position: absolute;
        inset: 0;
        display: none;
        place-content: center;
        padding: 2rem;
        color: var(--on-void);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="backdrop"></div>
      <div id="reader"></div>
      <div id="start">
        <h1>Chytach</h1>
        <p>Читалка електронних книг</p>
        <button id="open-book" type="button">Відкрити книгу</button>
        <button id="open-sample" type="button">Показати зразок</button>
      </div>
      <div id="error"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chytach</title>
    <style>
      /* Значення збігаються з BookAppearance у Swift-версії. */
      :root {
        --void: #0a0a0a;
        --paper: #cdc28b;
        --ink: #38331c;
        --on-void: #e4dfd0;
        --toolbar: #000000;
        --control: #323232;
        --footer: #212121;
        --toolbar-height: 44px;
        --footer-height: 38px;
        --page-turn-width: 30px;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        overflow: hidden;
        font-family: system-ui, "Segoe UI", sans-serif;
        color: var(--on-void);
        /* Книга — не текстове поле: випадкове виділення лише заважає. */
        user-select: none;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      #stage {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
      }

      /* ── Шапка ─────────────────────────────────────────────── */

      #toolbar {
        display: none;
        flex: 0 0 var(--toolbar-height);
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: var(--toolbar);
      }

      #toolbar.visible {
        display: flex;
      }

      #toolbar .spacer {
        flex: 1;
      }

      .tool {
        display: grid;
        place-items: center;
        width: 30px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: var(--control);
      }

      .tool:hover {
        background: #3f3f3f;
      }

      .tool svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: var(--on-void);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Область читання ───────────────────────────────────── */

      #middle {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      #backdrop {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image: url(./grain.png);
        background-repeat: repeat;
        background-size: 128px 128px;
      }

      #reader {
        position: absolute;
        inset: 0;
      }

      /* Розміри кадрів задає застосунок: тулкіт лише вішає на них клас і
         ставить `position: absolute`, власного CSS не возить. Без цього
         правила браузер малює iframe типовими 300×150. */
      #reader iframe.readium-navigator-iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Смуги гортання біля країв. Текст під них не лізе, бо бічні поля
         за замовчуванням ширші за смугу. */
      .page-turn {
        position: absolute;
        top: 0;
        bottom: 0;
        width: var(--page-turn-width);
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        opacity: 0;
        transition: opacity 0.12s linear;
      }

      .page-turn:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.14);
      }

      .page-turn svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: var(--ink);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #turn-back {
        left: 0;
      }

      #turn-forward {
        right: 0;
      }

      /* ── Підвал ────────────────────────────────────────────── */

      #footer {
        display: none;
        flex: 0 0 var(--footer-height);
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        background: var(--footer);
      }

      #footer.visible {
        display: flex;
      }

      #progress {
        flex: 1;
        height: 3px;
        appearance: none;
        background: #3a3a3a;
        border-radius: 2px;
      }

      #progress::-webkit-slider-thumb {
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--on-void);
        cursor: pointer;
      }

      #position {
        min-width: 4.5em;
        text-align: right;
        font-size: 12px;
        opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }

      /* ── Панелі ────────────────────────────────────────────── */

      .panel {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 10;
      }

      .panel.visible {
        display: grid;
      }

      .sheet {
        width: min(460px, 92vw);
        max-height: 86vh;
        overflow: auto;
        padding: 20px 22px 16px;
        border-radius: 12px;
        background: #1c1c1c;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }

      .sheet h2 {
        margin: 0 0 14px;
        font-size: 18px;
        font-weight: 500;
      }

      .sheet section {
        margin-bottom: 18px;
      }

      .sheet section > h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.5;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 0;
      }

      .stepper {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .stepper button {
        width: 28px;
        height: 24px;
        border: 0;
        border-radius: 6px;
        background: var(--control);
      }

      .stepper button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .stepper .value {
        min-width: 3.2em;
        text-align: center;
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
      }

      #themes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .theme {
        padding: 10px 6px;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 13px;
      }

      .theme.current {
        border-color: var(--on-void);
      }

      .sheet input[type="color"] {
        width: 44px;
        height: 26px;
        padding: 0;
        border: 0;
        background: none;
      }

      #preview {
        padding: 14px 16px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        text-align: justify;
      }

      .sheet-actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 4px;
      }

      .sheet-actions button {
        padding: 9px 18px;
        border: 0;
        border-radius: 999px;
        background: var(--control);
      }

      .sheet-actions .primary {
        background: var(--paper);
        color: var(--ink);
      }

      .sheet-actions .danger {
        background: none;
        color: #d98b80;
      }

      .sheet p {
        margin: 0 0 10px;
        line-height: 1.5;
      }

      .sheet .note {
        font-size: 13px;
        opacity: 0.6;
      }

      #donate-amounts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 8px;
      }

      #donate-amounts button {
        padding: 10px;
        border: 0;
        border-radius: 999px;
        background: var(--control);
      }

      #donate-amounts button.chosen {
        background: var(--paper);
        color: var(--ink);
      }

      #donate-custom {
        width: 100%;
        padding: 10px 12px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: none;
        color: var(--on-void);
      }

      .wide {
        width: 100%;
        margin-top: 10px;
        padding: 13px;
        border: 0;
        border-radius: 999px;
      }

      .wide.primary {
        background: var(--paper);
        color: var(--ink);
      }

      .detail {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.05);
      }

      .detail-label {
        display: block;
        font-size: 13px;
        opacity: 0.6;
      }

      .detail-value {
        display: block;
        font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
        font-size: 19px;
      }

      .detail button {
        padding: 8px 14px;
        border: 0;
        border-radius: 999px;
        background: var(--control);
      }

      /* Зміст і бібліотека — переліки. */
      .list {
        display: flex;
        flex-direction: column;
      }

      .list button {
        padding: 9px 10px;
        border: 0;
        border-radius: 6px;
        background: none;
        text-align: left;
      }

      .list button:hover {
        background: #2a2a2a;
      }

      .list button.current {
        color: var(--paper);
      }

      .list .meta {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        opacity: 0.5;
      }

      /* ── Початковий екран ──────────────────────────────────── */

      #start {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: var(--void);
        z-index: 5;
      }

      #start.visible {
        display: flex;
      }

      #start h1 {
        margin: 0;
        font-size: 44px;
        font-weight: 400;
      }

      #start p {
        margin: 0 0 32px;
        opacity: 0.6;
      }

      #open-book {
        min-width: 240px;
        padding: 14px 24px;
        border: 0;
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
      }

      #open-sample {
        margin-top: 6px;
        padding: 10px;
        border: 0;
        background: none;
        color: var(--on-void);
        opacity: 0.7;
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      #languages {
        margin-top: 26px;
        display: flex;
        gap: 10px;
      }

      #languages button {
        padding: 8px 12px;
        border: 0;
        background: none;
        color: var(--on-void);
        opacity: 0.7;
        font-size: 14px;
      }

      #error {
        position: absolute;
        inset: 0;
        display: none;
        place-content: center;
        padding: 2rem;
        background: var(--void);
        white-space: pre-wrap;
        z-index: 6;
      }

      #error.visible {
        display: grid;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="toolbar">
        <button class="tool" id="tool-close" data-i18n-title="tool.close">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button class="tool" id="tool-library" data-i18n-title="tool.library">
          <svg viewBox="0 0 24 24">
            <path d="M5 4v16M10 4v16M15.5 5l4 15" />
          </svg>
        </button>
        <button class="tool" id="tool-open" data-i18n-title="tool.open">
          <svg viewBox="0 0 24 24">
            <path d="M3 7h6l2 2h10v10H3z" />
          </svg>
        </button>
        <button class="tool" id="tool-contents" data-i18n-title="tool.contents">
          <svg viewBox="0 0 24 24">
            <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" />
          </svg>
        </button>
        <span class="spacer"></span>
        <button class="tool" id="tool-support" data-i18n-title="tool.support">
          <svg viewBox="0 0 24 24">
            <path d="M12 20s-8-5.5-8-11a4.2 4.2 0 0 1 8-1.8A4.2 4.2 0 0 1 20 9c0 5.5-8 11-8 11z" />
          </svg>
        </button>
        <button class="tool" id="tool-appearance" data-i18n-title="tool.appearance">
          <svg viewBox="0 0 24 24">
            <path d="M4 7V5h10v2M9 5v14M7 19h4M14 13h6M17 10v9" />
          </svg>
        </button>
      </div>

      <div id="middle">
        <div id="backdrop"></div>
        <div id="reader"></div>
        <button class="page-turn" id="turn-back" data-i18n-title="tool.back">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button class="page-turn" id="turn-forward" data-i18n-title="tool.forward">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
        </button>

        <div id="start">
          <h1>Chytach</h1>
          <p data-i18n="app.tagline"></p>
          <button id="open-book" type="button" data-i18n="start.open"></button>
          <button id="open-sample" type="button" data-i18n="start.sample"></button>
          <div id="languages">
            <button id="language-uk" type="button" data-i18n="start.languageUk"></button>
            <button id="language-en" type="button" data-i18n="start.languageEn"></button>
          </div>
        </div>
        <div id="error"></div>
      </div>

      <div id="footer">
        <button class="tool" id="jump-start" data-i18n-title="tool.jumpStart">
          <svg viewBox="0 0 24 24"><path d="M17 5l-7 7 7 7M6 5v14" /></svg>
        </button>
        <input id="progress" type="range" min="0" max="1000" value="0" />
        <button class="tool" id="jump-end" data-i18n-title="tool.jumpEnd">
          <svg viewBox="0 0 24 24"><path d="M7 5l7 7-7 7M18 5v14" /></svg>
        </button>
        <span id="position"></span>
      </div>

      <div class="panel" id="panel-appearance">
        <div class="sheet">
          <h2 data-i18n="appearance.title"></h2>

          <section>
            <h3 data-i18n="appearance.sample"></h3>
            <div id="preview" data-i18n="appearance.sampleText"></div>
          </section>

          <section>
            <h3 data-i18n="appearance.themes"></h3>
            <div id="themes"></div>
          </section>

          <section>
            <h3 data-i18n="appearance.ownColors"></h3>
            <div class="row">
              <span data-i18n="appearance.paper"></span>
              <input type="color" id="color-paper" />
            </div>
            <div class="row">
              <span data-i18n="appearance.ink"></span>
              <input type="color" id="color-ink" />
            </div>
          </section>

          <section>
            <h3 data-i18n="appearance.textSize"></h3>
            <div class="row">
              <span data-i18n="appearance.fontSize"></span>
              <span class="stepper" id="step-font"></span>
            </div>
          </section>

          <section>
            <h3 data-i18n="appearance.margins"></h3>
            <div class="row">
              <span data-i18n="appearance.left"></span>
              <span class="stepper" id="step-left"></span>
            </div>
            <div class="row">
              <span data-i18n="appearance.right"></span>
              <span class="stepper" id="step-right"></span>
            </div>
            <div class="row">
              <span data-i18n="appearance.gap"></span>
              <span class="stepper" id="step-gap"></span>
            </div>
          </section>

          <div class="sheet-actions">
            <button class="danger" id="appearance-reset" data-i18n="appearance.reset"></button>
            <button class="primary" id="appearance-done" data-i18n="common.done"></button>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-support">
        <div class="sheet">
          <h2 id="donate-title" data-i18n="donate.title"></h2>
          <p id="donate-body"></p>
          <p class="note" id="donate-voluntary"></p>

          <section>
            <h3 data-i18n="donate.jar"></h3>
            <div id="donate-amounts"></div>
            <input
              id="donate-custom"
              type="number"
              min="1"
              data-i18n-placeholder="donate.customAmount"
            />
            <button class="wide primary" id="donate-go">
              <span data-i18n="donate.go"></span>
            </button>
            <p class="note" id="donate-jar-note"></p>
          </section>

          <section>
            <h3 data-i18n="donate.card"></h3>
            <div class="detail">
              <div>
                <span class="detail-label" data-i18n="donate.cardNumber"></span>
                <span class="detail-value" id="donate-card"></span>
              </div>
              <button id="donate-copy" data-i18n="donate.copy"></button>
            </div>
            <p class="note" id="donate-currency-note"></p>
          </section>

          <div class="sheet-actions">
            <span></span>
            <button id="donate-close"></button>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-contents">
        <div class="sheet">
          <h2 data-i18n="contents.title"></h2>
          <div class="list" id="contents-list"></div>
          <div class="sheet-actions">
            <span></span>
            <button class="primary" id="contents-done" data-i18n="common.done"></button>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-library">
        <div class="sheet">
          <h2 data-i18n="library.title"></h2>
          <div class="list" id="library-list"></div>
          <div class="sheet-actions">
            <button id="library-add" data-i18n="library.add"></button>
            <button class="primary" id="library-done" data-i18n="common.done"></button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

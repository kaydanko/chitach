# Конфігурація XcodeGen. Після зміни: `xcodegen generate`.
# .xcodeproj навмисно не комітиться — генерується з цього файлу.
#
# Структура скопійована з Readium Playground/project.yml @ 3.11.0.
# Зокрема SWIFT_APPROACHABLE_CONCURRENCY і SWIFT_DEFAULT_ACTOR_ISOLATION —
# це офіційна конфігурація Readium для роботи зі Swift 6 concurrency.

name: Chytach

options:
  bundleIdPrefix: com.kabuki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    from: 3.11.0

schemes:
  Chytach:
    build:
      targets:
        Chytach: all
        ChytachTests: [test]
    test:
      targets:
        - ChytachTests
      gatherCoverageData: true

targets:
  Chytach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Resources/**"
      # Зразок книги для Фази 0. Прибрати, коли з'явиться імпорт (Фаза 2).
      - path: Sources/Resources
        buildPhase: resources
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chytach
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Світла тема дає біле тло вікна до першого кадру — на Mac це
        # найпомітніше джерело спалаху при запуску.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Потрібне для Фази 2 (імпорт через Files / Open In).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Без цього «Відкрити за допомогою» не показує Chytach: обробник
        # вхідних файлів у застосунку є (`onOpenURL`), але система не знає,
        # що він щось із цього вміє. Перелічені лише типи зі стандартними
        # ідентифікаторами; CBZ і FB2 власних не мають — для них знадобиться
        # окреме оголошення типу.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Книга
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
              - com.adobe.pdf
              - public.plain-text
              - public.rtf
              - com.apple.rtfd
              - net.daringfireball.markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kabuki.chytach
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Swift 5 language mode — свідомо, не через недогляд.
        #
        # Readium 3.11.0 зібраний під swift-tools-version:5.10. Його публічні
        # типи (Publication, AssetRetriever, Asset) не Sendable. У Swift 6
        # language mode будь-який виклик Readium з @MainActor-коду дає
        # SendingRisksDataRace як помилку компіляції.
        #
        # Readium Playground @ 3.11.0 не задає SWIFT_VERSION взагалі, тобто
        # теж працює в Swift 5 mode з увімкненими approachable-concurrency
        # прапорцями. Ми відтворюємо саме цю конфігурацію.
        #
        # Перехід на 6.0 — окремий пункт Фази 7, після того як Readium сам
        # перейде на Swift 6 tools.
        SWIFT_VERSION: "5.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  ChytachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      # Тестові книги копіюються в бандл тестів, а не компілюються.
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Chytach
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
    settings:
      base:
        # Swift 5 language mode — свідомо, не через недогляд.
        #
        # Readium 3.11.0 зібраний під swift-tools-version:5.10. Його публічні
        # типи (Publication, AssetRetriever, Asset) не Sendable. У Swift 6
        # language mode будь-який виклик Readium з @MainActor-коду дає
        # SendingRisksDataRace як помилку компіляції.
        #
        # Readium Playground @ 3.11.0 не задає SWIFT_VERSION взагалі, тобто
        # теж працює в Swift 5 mode з увімкненими approachable-concurrency
        # прапорцями. Ми відтворюємо саме цю конфігурацію.
        #
        # Перехід на 6.0 — окремий пункт Фази 7, після того як Readium сам
        # перейде на Swift 6 tools.
        SWIFT_VERSION: "5.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

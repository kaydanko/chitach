# Конфігурація XcodeGen. Після зміни: `xcodegen generate`.
# .xcodeproj навмисно не комітиться — генерується з цього файлу.
#
# Структура скопійована з Readium Playground/project.yml @ 3.11.0.
# Зокрема SWIFT_APPROACHABLE_CONCURRENCY і SWIFT_DEFAULT_ACTOR_ISOLATION —
# це офіційна конфігурація Readium для роботи зі Swift 6 concurrency.

name: Chytach

options:
  bundleIdPrefix: com.kabuki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Українська — мова вихідних рядків у коді; англійська — переклад.
  developmentLanguage: uk

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    from: 3.11.0

schemes:
  Chytach:
    build:
      targets:
        Chytach: all
        ChytachTests: [test]
    test:
      targets:
        - ChytachTests
      gatherCoverageData: true

targets:
  Chytach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Resources/**"
      # Зразок книги для Фази 0. Прибрати, коли з'явиться імпорт (Фаза 2).
      - path: Sources/Resources
        buildPhase: resources
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chytach
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Світла тема дає біле тло вікна до першого кадру — на Mac це
        # найпомітніше джерело спалаху при запуску.
        UIUserInterfaceStyle: Dark
        # Рядок стану схований уже на запуску, а не лише після першого
        # кадру SwiftUI — інакше годинник блимав би й зникав.
        UIStatusBarHidden: true
        # Мови інтерфейсу. Обирає їх перемикач на заставці (`AppLanguage`);
        # цей перелік лише каже системі, що застосунок їх має.
        CFBundleLocalizations:
          - uk
          - en
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Знімає стелю в 60 Гц на iPhone із ProMotion.
        #
        # Без цього ключа система обмежує застосунок 60 кадрами, хоч екран
        # уміє 120: анімація гортання виглядала б удвічі менш плавною, ніж
        # може. На економність це не впливає — екран сам опускає частоту,
        # коли нічого не рухається, а ключ лише прибирає стелю згори.
        CADisableMinimumFrameDurationOnPhone: true
        # Потрібне для Фази 2 (імпорт через Files / Open In).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Без цього «Відкрити за допомогою» не показує Chytach: обробник
        # вхідних файлів у застосунку є (`onOpenURL`), але система не знає,
        # що він щось із цього вміє. Перелічені лише типи зі стандартними
        # ідентифікаторами; CBZ і FB2 власних не мають — для них знадобиться
        # окреме оголошення типу.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Книга
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
              - com.adobe.pdf
              - public.plain-text
              - public.rtf
              - com.apple.rtfd
              - net.daringfireball.markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kabuki.chytach
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Swift 6 language mode — лише для нашого коду.
        #
        # Readium 3.11.x досі на swift-tools-version:5.10 і далі збирається
        # у власному режимі Swift 5: мовний режим пакета задає його
        # Package.swift, а не ця настройка. Чекати, доки Readium перейде
        # сам, не довелося — межа з ним уже чиста: виклики, які компілятор
        # вважав передачею не-Sendable `Publication`, перевірено в коді
        # Readium і позначено `@preconcurrency import ReadiumShared` (див.
        # ReaderHostViewController.swift), решту виправлено в нашому коді.
        #
        # Наслідок режиму 6, про який варто памʼятати: порушення ізоляції
        # акторів тут уже не попередження, а помилка компіляції, а
        # невідповідність виконавця перевіряється й під час роботи.
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        # Рядки з коду потрапляють у Localizable.xcstrings: Xcode сам додає
        # нові ключі, щойно в коді зʼявляється новий напис.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  ChytachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
          # Самодостатні перевірки — окремі програми з власним `@main`,
          # які збираються напряму через Scripts/test-rtf.sh і test-fb2.sh.
          # Тестовій цілі вони чужі: вона не має ні їхнього `main`, ні
          # доступу до внутрішніх типів застосунку в тому ж вигляді.
          - "Standalone/**"
      # Тестові книги копіюються в бандл тестів, а не компілюються.
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Chytach
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
    settings:
      base:
        # Swift 6 language mode — лише для нашого коду.
        #
        # Readium 3.11.x досі на swift-tools-version:5.10 і далі збирається
        # у власному режимі Swift 5: мовний режим пакета задає його
        # Package.swift, а не ця настройка. Чекати, доки Readium перейде
        # сам, не довелося — межа з ним уже чиста: виклики, які компілятор
        # вважав передачею не-Sendable `Publication`, перевірено в коді
        # Readium і позначено `@preconcurrency import ReadiumShared` (див.
        # ReaderHostViewController.swift), решту виправлено в нашому коді.
        #
        # Наслідок режиму 6, про який варто памʼятати: порушення ізоляції
        # акторів тут уже не попередження, а помилка компіляції, а
        # невідповідність виконавця перевіряється й під час роботи.
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
